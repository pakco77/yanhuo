/* style.css : 烟火侠客 挂机版 v1 — cozy parchment-and-wood pixel UI, portrait phone first */
:root {
  --ink: #3b2416; --ink2: #6b4a32; --ink3: #9a7a5a;
  --parch: #f8ecd0; --parch2: #efdcb2; --parch3: #e0c48e; --hi: #fffaf0;
  --wood: #6e4428; --wood2: #4c2c18; --wood3: #331d10;
  --red: #d6503c; --red2: #a8352b; --gold: #f5c650; --gold2: #d8952a;
  --jade: #4f9a62; --blue: #4a78c8; --night: #1c2647; --night2: #2b3a6b;
  --mid-bg: #efdfbd; --mid-dot: rgba(120, 80, 40, .07);
  --sys: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --pix: "Fusion Pixel", var(--sys);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --top-h: 56px; --bot-h: 62px; --act-h: 70px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--wood3); touch-action: manipulation; }
body { position: fixed; inset: 0; font: 15px/1.55 var(--sys); color: var(--ink); -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
input, select, textarea { font: 16px/1.4 var(--sys); color: var(--ink); -webkit-user-select: text; user-select: text; }
img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
img.px, canvas.px { image-rendering: pixelated; }
.px12 { font: 12px/16px var(--pix); letter-spacing: 0; }
.px24 { font: 24px/28px var(--pix); letter-spacing: 0; }
.px36 { font: 36px/40px var(--pix); letter-spacing: 0; }
h1, h2, h3, p { margin: 0; font-weight: normal; }

#app { position: fixed; inset: 0; }
#top, #mid, #act, #bot, #create { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 480px; }

/* ---------- top bar (dark wood, white status-bar text sits on it) ---------- */
#top {
  top: 0; height: calc(var(--top-h) + var(--sat)); padding: var(--sat) calc(10px + var(--sar)) 0 calc(10px + var(--sal)); z-index: 20;
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(#5a3820, #3f2615 70%, #33200f); border-bottom: 2px solid #1e110a;
  box-shadow: inset 0 -2px 0 #6e4a2c, 0 2px 0 rgba(0, 0, 0, .25);
}
.tb-me { width: 44px; height: 44px; flex: none; border: 2px solid #1e110a; border-radius: 10px; background: #f1dfb9; overflow: hidden; box-shadow: inset 0 0 0 2px #fff4dc; position: relative; }
.tb-me canvas { width: 40px; height: 40px; display: block; margin: 0; }
.tb-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tb-name { color: #f8e6c0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 0 #1e110a; }
.spirit { display: flex; align-items: center; gap: 5px; color: #e8cfa0; }
.spirit .bar { width: 72px; height: 10px; border: 2px solid #1e110a; border-radius: 3px; background: #2a180c; overflow: hidden; box-shadow: 0 1px 0 #6e4a2c; }
.spirit .bar i { display: block; height: 100%; width: 50%; background: linear-gradient(#9fe07a 0 40%, #5fb04a 40%); transition: width .6s; }
.spirit.mid .bar i { background: linear-gradient(#ffd77a 0 40%, #e8a838 40%); }
.spirit.low .bar i { background: linear-gradient(#ff9a7a 0 40%, #d6503c 40%); }
.tb-right { display: flex; align-items: center; gap: 5px; flex: none; }
.pill { height: 30px; display: inline-flex; align-items: center; gap: 2px; padding: 0 8px 0 3px; border: 2px solid #1e110a; border-radius: 15px; background: var(--parch); box-shadow: inset 0 -2px 0 var(--parch3); color: var(--ink); }
.pill img { width: 24px; height: 24px; }
.pill b { font-weight: normal; padding-top: 1px; }
.tb-mail { width: 40px; height: 44px; position: relative; display: grid; place-items: center; }
.tb-mail img { width: 24px; height: 24px; }
.dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #ff4a3a; border: 2px solid #1e110a; top: 6px; right: 4px; animation: dotpulse 1.6s ease-in-out infinite; }
@keyframes dotpulse { 50% { transform: scale(1.25); } }

/* ---------- middle (the only scrolling area) ---------- */
#mid {
  top: calc(var(--top-h) + var(--sat)); bottom: calc(var(--bot-h) + var(--sab)); z-index: 1;
  overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  background-color: var(--mid-bg);
  background-image: radial-gradient(var(--mid-dot) 1px, transparent 1.5px), radial-gradient(var(--mid-dot) 1px, transparent 1.5px);
  background-size: 14px 14px; background-position: 0 0, 7px 7px;
  transition: background-color .8s;
}
#app.with-act #mid { bottom: calc(var(--bot-h) + var(--act-h) + var(--sab)); }
.scr { padding-bottom: 18px; min-height: 100%; }
#app.ph-night { --mid-bg: #1f2848; --mid-dot: rgba(200, 210, 255, .09); }
#app.ph-dusk { --mid-bg: #ecd2b0; }
#app.ph-dawn { --mid-bg: #f2dcc4; }

/* ---------- scenes (canvas at 2 css px per art px, cropped symmetric on narrow phones) ---------- */
.scene { position: relative; overflow: hidden; background: #2a1c12; border-bottom: 2px solid var(--ink); }
.cvwrap { position: relative; width: 390px; }
.cvwrap canvas { display: block; width: 100%; height: auto; }
.chips { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 3; }
.chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 3px 9px 3px 5px; border: 2px solid var(--ink); border-radius: 9px; background: rgba(248, 236, 208, .94); box-shadow: inset 0 0 0 2px rgba(255, 250, 240, .7), 0 2px 0 rgba(59, 36, 22, .35); color: var(--ink); }
.chip img { width: 24px; height: 24px; }
.chip .pips { display: inline-flex; gap: 3px; margin-left: 2px; }
.chip .pips i { width: 10px; height: 10px; border: 2px solid var(--ink); background: var(--parch2); border-radius: 2px; }
.chip .pips i.on { background: var(--gold); box-shadow: inset -1px -1px 0 var(--gold2); }
button.chip { min-height: 44px; min-width: 44px; margin: -7px -7px 0 0; border-width: 7px; border-color: transparent; background-clip: padding-box; box-shadow: none; padding: 0; }
button.chip > span { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 3px 9px 3px 5px; border: 2px solid var(--ink); border-radius: 9px; background: rgba(248, 236, 208, .94); box-shadow: inset 0 0 0 2px rgba(255, 250, 240, .7), 0 2px 0 rgba(59, 36, 22, .35); }
.scene .hits { position: absolute; inset: 0; z-index: 2; }
.hit { position: absolute; border-radius: 8px; }
.hit:active { background: rgba(255, 246, 220, .22); box-shadow: 0 0 0 2px rgba(255, 246, 220, .8); }
.hit.plus::after { content: "+"; position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2px solid rgba(59, 36, 22, .7); background: rgba(255, 238, 180, .85); font: 12px/16px var(--pix); text-align: center; color: var(--ink); animation: plusbob 2s ease-in-out infinite; }
@keyframes plusbob { 50% { transform: translateY(-3px); } }
.bubble { position: absolute; z-index: 4; transform: translate(-50%, -100%); padding: 5px 10px; background: var(--hi); border: 2px solid var(--ink); border-radius: 10px; white-space: nowrap; box-shadow: 0 2px 0 rgba(59, 36, 22, .35); pointer-events: none; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -5px; border: 5px solid transparent; border-top: 6px solid var(--ink); }
.bubble.bob { animation: bubbob 1.4s ease-in-out infinite; }
.bubble.r { transform: translate(-82%, -100%); }
.bubble.r::after { left: 82%; }
.bubble.say { animation: bubsay .25s ease-out; }
@keyframes bubbob { 50% { transform: translate(-50%, calc(-100% - 4px)); } }
@keyframes bubsay { from { transform: translate(-50%, -80%) scale(.6); opacity: 0; } }

/* status plate under the scene */
.plate { position: relative; z-index: 4; margin: -16px 12px 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; background: var(--parch); border: 2px solid var(--ink); border-radius: 10px; box-shadow: inset 0 0 0 2px var(--hi), 0 3px 0 rgba(59, 36, 22, .3); }
.plate .when { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 44px; padding: 3px 4px; border-radius: 6px; background: var(--red); color: #fff4dc; border: 2px solid var(--ink); text-shadow: 1px 1px 0 var(--red2); }
.plate .when.home { background: var(--jade); text-shadow: 1px 1px 0 #2e6a3e; }
.plate .when.night { background: var(--night2); text-shadow: 1px 1px 0 #10183a; }
.plate p { font-size: 15px; line-height: 1.45; }

/* ---------- cards ---------- */
.card { position: relative; margin: 14px 12px 0; padding: 14px 14px 12px; background: var(--parch); border: 2px solid var(--ink); border-radius: 12px; box-shadow: inset 0 0 0 2px var(--hi), inset 0 -4px 0 1px rgba(170, 120, 60, .16), 0 3px 0 rgba(59, 36, 22, .3); }
.card.tagged { margin-top: 24px; padding-top: 18px; }
.tag { position: absolute; top: -13px; left: 12px; display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 9px 0 4px; background: var(--parch2); border: 2px solid var(--ink); border-radius: 7px; color: var(--ink); box-shadow: inset 0 -2px 0 var(--parch3); }
.tag img { width: 24px; height: 24px; margin: -2px 0; }
.tag.red { background: var(--red); color: #fff4dc; box-shadow: inset 0 -2px 0 var(--red2); text-shadow: 1px 1px 0 var(--red2); }
.tag.gold { background: var(--gold); box-shadow: inset 0 -2px 0 var(--gold2); }
.tag.blue { background: #6c9ae0; color: #fff; box-shadow: inset 0 -2px 0 #3c64b0; text-shadow: 1px 1px 0 #3c64b0; }
.link { position: absolute; top: -13px; right: 12px; height: 24px; display: inline-flex; align-items: center; padding: 0 10px; background: var(--hi); border: 2px solid var(--ink); border-radius: 7px; }
.link::before { content: ""; position: absolute; inset: -10px -8px; }
.lines { list-style: none; margin: 0; padding: 0; }
.lines li { display: flex; gap: 6px; align-items: flex-start; padding: 5px 0; }
.lines li + li { border-top: 1px dashed rgba(107, 74, 50, .25); }
.lines .t { flex: none; width: 38px; padding-top: 3px; color: var(--ink3); }
.lines img { flex: none; width: 24px; height: 24px; margin-top: -1px; }
.lines .x { flex: 1; min-width: 0; }
.lines li.tap { cursor: pointer; }
.lines li.tap .x::after { content: " ›"; color: var(--red); font-weight: 600; }
.rv { animation: rv .5s ease-out both; }
.card.flash { animation: cflash 1.1s ease-out .35s; }
@keyframes cflash { 0%, 60% { box-shadow: 0 0 0 4px var(--gold), 0 3px 0 rgba(59, 36, 22, .3); } }
@keyframes rv { from { opacity: 0; transform: translateY(8px); } }
.empty { color: var(--ink3); text-align: center; padding: 18px 8px; }
.calm { text-align: center; color: var(--ink2); padding: 16px 14px; }
.calm .px24 { display: block; margin-bottom: 6px; color: var(--ink); }
#app.ph-night .calm-wrap .card { background: #f1e2c2; }

/* decision */
.dec .body { display: flex; gap: 10px; align-items: center; }
.dec .art { flex: none; width: 64px; height: 64px; border-radius: 10px; background: var(--parch2); border: 2px solid rgba(59, 36, 22, .25); display: grid; place-items: center; }
.dec .art img { width: 64px; height: 64px; }
.dec .q { font-size: 16px; line-height: 1.5; }
.dec .opts { display: flex; gap: 10px; margin-top: 12px; }
.dec .opts .btn { flex: 1; }
.dec .foot { margin-top: 8px; color: var(--ink3); text-align: center; }
.dec.done .q { color: var(--ink2); }
.dec.done .ok { display: inline-block; margin-right: 4px; color: var(--jade); }

/* ---------- buttons ---------- */
.btn { position: relative; min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--ink); border-radius: 11px;
  background: linear-gradient(#fff6e2, #f0dcb2); color: var(--ink); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .8), inset 0 -3px 0 rgba(160, 110, 50, .35), 0 3px 0 var(--ink); transition: transform .06s; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), inset 0 -2px 0 rgba(160, 110, 50, .35), 0 1px 0 var(--ink); }
.btn img { width: 24px; height: 24px; }
.btn.pri, .k-wake { background: linear-gradient(#ffe39a, #f2b347); box-shadow: inset 0 2px 0 #fff6c8, inset 0 -4px 0 #cf8a26, 0 3px 0 var(--ink); }
.btn.red, .k-meal { background: linear-gradient(#ff9a72, #e2583e); color: #fff8ea; text-shadow: 2px 2px 0 #a8352b; box-shadow: inset 0 2px 0 #ffc3a6, inset 0 -4px 0 #b63c2c, 0 3px 0 var(--ink); }
.btn.blue, .k-bundle { background: linear-gradient(#8ab8f2, #4a78c8); color: #fff; text-shadow: 2px 2px 0 #2c4f96; box-shadow: inset 0 2px 0 #c4dcff, inset 0 -4px 0 #34599e, 0 3px 0 var(--ink); }
.btn.night, .k-sleep { background: linear-gradient(#6c7cc8, #34407e); color: #fff3d6; text-shadow: 2px 2px 0 #1c2452; box-shadow: inset 0 2px 0 #a6b2ec, inset 0 -4px 0 #232c60, 0 3px 0 var(--ink); }
.btn.calmk, .k-calm { background: linear-gradient(#3a4878, #26305a); color: #c9d2f2; text-shadow: 2px 2px 0 #141a38; box-shadow: inset 0 2px 0 #56649a, inset 0 -4px 0 #182048, 0 3px 0 #0e1328; }
.btn.green { background: linear-gradient(#a6e08a, #5fa84a); color: #fff; text-shadow: 2px 2px 0 #3c7a2e; box-shadow: inset 0 2px 0 #d4f4c0, inset 0 -4px 0 #44863a, 0 3px 0 var(--ink); }
.btn.ghost { background: transparent; box-shadow: none; border-color: rgba(59, 36, 22, .5); }
.btn.danger { background: linear-gradient(#fff0e6, #f4cfc0); color: var(--red2); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.big { width: 100%; height: 54px; font: 24px/28px var(--pix); }
.btn.sm { min-height: 44px; padding: 0 12px; font: 12px/16px var(--pix); }

/* ---------- big contextual button ---------- */
#act { bottom: calc(var(--bot-h) + var(--sab)); height: var(--act-h); padding: 6px calc(14px + var(--sar)) 0 calc(14px + var(--sal)); z-index: 15;
  background: linear-gradient(rgba(239, 223, 189, 0), var(--mid-bg) 26%); }
#app.ph-night #act { background: linear-gradient(rgba(31, 40, 72, 0), var(--mid-bg) 26%); }
#act .btn.big { height: 56px; }
#act .btn img { width: 24px; height: 24px; }
.glow { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12) saturate(1.1); } }
.glow::after { content: ""; position: absolute; inset: -2px; border-radius: 12px; animation: ring 2.4s ease-out infinite; pointer-events: none; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255, 226, 140, .7); } 70%, 100% { box-shadow: 0 0 0 12px rgba(255, 226, 140, 0); } }
.act-sub { display: none; }

/* ---------- bottom bar ---------- */
#bot { bottom: 0; height: calc(var(--bot-h) + var(--sab)); padding: 0 calc(4px + var(--sar)) var(--sab) calc(4px + var(--sal)); z-index: 20; display: flex; align-items: stretch;
  background: linear-gradient(#f6e6c4, #ead3a4); border-top: 2px solid var(--ink); box-shadow: inset 0 2px 0 var(--hi), 0 -2px 0 rgba(59, 36, 22, .15); }
#bot button { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 44px; color: var(--ink2); border-radius: 10px; margin: 4px 1px; }
#bot button img { width: 24px; height: 24px; transition: transform .2s; }
#bot button.on { color: var(--ink); background: rgba(160, 110, 50, .18); box-shadow: inset 0 2px 0 rgba(120, 80, 40, .2); }
#bot button.on img { transform: translateY(-2px); }
#bot button .dot { top: 3px; right: calc(50% - 20px); }
#bot button.mid { margin-top: -14px; }
#bot button.mid b { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--ink); background: linear-gradient(#ff9a72, #e2583e); box-shadow: inset 0 2px 0 #ffc3a6, inset 0 -4px 0 #b63c2c, 0 3px 0 var(--ink); }
#bot button.mid:active b { transform: translateY(2px); }
#bot button.mid.full b { background: linear-gradient(#e8d6b0, #cdb488); box-shadow: inset 0 2px 0 #fff2d0, inset 0 -4px 0 #a88c60, 0 3px 0 var(--ink); }
#bot button.mid span { margin-top: 2px; }
#bot .bump { animation: bump .5s ease-out; }
@keyframes bump { 30% { transform: scale(1.35) translateY(-4px); } }

/* ---------- sheets & overlays ---------- */
#layer { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#layer > * { pointer-events: auto; }
.sheet-bg { position: fixed; inset: 0; background: rgba(30, 16, 8, .5); animation: fade .2s ease-out; }
.sheet-bg.out { animation: fadeout .2s ease-in forwards; }
.sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); margin: 0 auto; max-width: 480px; max-height: calc(100% - var(--sat) - 24px); display: flex; flex-direction: column;
  background: var(--parch); border: 2px solid var(--ink); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: inset 0 2px 0 var(--hi), 0 -4px 0 rgba(0, 0, 0, .15); animation: up .28s cubic-bezier(.2, .9, .3, 1.1); }
.sheet.out { animation: down .2s ease-in forwards; }
.sheet::before { content: ""; position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: rgba(107, 74, 50, .35); }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 14px 8px 4px 16px; flex: none; }
.sheet-h h2 { flex: 1; }
.sheet-h .x { width: 44px; height: 44px; display: grid; place-items: center; font: 24px/1 var(--pix); color: var(--ink2); }
.sheet-b { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px 12px; }
.sheet-f { flex: none; display: flex; gap: 10px; padding: 10px 16px calc(12px + var(--sab)); border-top: 2px dashed rgba(107, 74, 50, .25); }
.sheet-f .btn { flex: 1; }
.sheet.nofoot .sheet-b { padding-bottom: calc(18px + var(--sab)); }
.sheet .sub { color: var(--ink2); margin: 2px 0 10px; }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes up { from { transform: translateY(100%); } }
@keyframes down { to { transform: translateY(100%); } }

/* meal sheet */
.meal-top { display: flex; gap: 12px; align-items: stretch; }
.photo { flex: none; width: 96px; height: 96px; border: 2px dashed var(--ink2); border-radius: 12px; background: var(--parch2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; overflow: hidden; color: var(--ink2); }
.photo img.cam { width: 48px; height: 48px; }
.photo img.th { position: absolute; inset: 0; width: 100%; height: 100%; }
.photo input { position: absolute; inset: 0; opacity: 0; font-size: 0; }
.photo.has { border-style: solid; border-color: var(--ink); }
.meal-name { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
.inp { width: 100%; height: 48px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hi); box-shadow: inset 0 2px 0 rgba(160, 110, 50, .18); outline: none; }
.inp:focus { border-color: var(--red); }
.flv { display: flex; gap: 6px; margin: 14px 0 4px; }
.flv button { flex: 1; min-height: 52px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hi); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 2px 0 var(--ink); }
.flv button i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--ink); }
.flv button.on { background: var(--c); color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, .35); transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.flv button.on i { background: #fff !important; }
.meal-say { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--parch2); color: var(--ink2); }
.meal-say img { width: 24px; height: 24px; flex: none; }
.meal-today { display: flex; gap: 8px; margin-top: 12px; align-items: center; color: var(--ink3); }
.meal-today img { width: 36px; height: 48px; }
.ticket-show { display: flex; flex-direction: column; align-items: center; padding: 6px 0 4px; }
.ticket-show .tk { width: 144px; height: 192px; animation: tkin .5s cubic-bezier(.2, 1.4, .4, 1); filter: drop-shadow(0 4px 0 rgba(59, 36, 22, .35)); }
.ticket-show .nm { margin-top: 10px; }
.ticket-show .badges { margin-top: 6px; display: flex; gap: 6px; }
@keyframes tkin { from { transform: scale(.3) rotate(-12deg); opacity: 0; } }
.fly { position: fixed; z-index: 60; pointer-events: none; transition: transform .7s cubic-bezier(.5, -0.3, .7, 1), opacity .7s; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; border: 2px solid var(--ink); background: var(--parch2); font: 12px/16px var(--pix); }
.badge.q1 { background: linear-gradient(#ffffff, #c8d2e2); }
.badge.q2 { background: linear-gradient(#fff2a6, #eab83c); }
.badge.new { background: var(--red); color: #fff; }

/* bundle overlay */
.ov { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; overflow: hidden; color: #fbefd6;
  background: radial-gradient(circle at 50% 42%, #7a4a26 0%, #3a2010 46%, #160a05 100%); animation: fade .3s ease-out; padding: calc(var(--sat) + 10px) 16px calc(var(--sab) + 16px); }
.ov.out { animation: fadeout .25s ease-in forwards; }
.ov .rays { position: absolute; left: 50%; top: 42%; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; opacity: 0; transition: opacity .6s;
  background: repeating-conic-gradient(from 0deg, rgba(255, 222, 150, .16) 0deg 9deg, rgba(255, 222, 150, 0) 9deg 22.5deg);
  -webkit-mask: radial-gradient(circle, #000 0%, rgba(0, 0, 0, .6) 35%, transparent 68%); mask: radial-gradient(circle, #000 0%, rgba(0, 0, 0, .6) 35%, transparent 68%); animation: spin 18s linear infinite; }
.ov.lit .rays { opacity: 1; }
.ov.q1 .rays { background: repeating-conic-gradient(from 0deg, rgba(220, 235, 255, .26) 0deg 9deg, rgba(220, 235, 255, 0) 9deg 22.5deg); }
.ov.q2 .rays { background: repeating-conic-gradient(from 0deg, rgba(255, 214, 90, .38) 0deg 9deg, rgba(255, 214, 90, 0) 9deg 22.5deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.ov-top { position: relative; z-index: 2; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 44px; gap: 8px; text-shadow: 2px 2px 0 #1a0c04; }
.ov-close { position: absolute; right: -8px; top: 0; width: 44px; height: 44px; font: 24px/1 var(--pix); color: #e8cfa0; }
.ov-dots { display: flex; gap: 6px; justify-content: center; min-height: 12px; margin-top: 4px; position: relative; z-index: 2; }
.ov-dots i { width: 10px; height: 10px; border-radius: 3px; border: 2px solid #1a0c04; background: #6a4a2a; }
.ov-dots i.on { background: var(--gold); }
.ov-stage { position: relative; z-index: 2; flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
.ov-art { position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
.ov-art img { display: block; }
.ov-art .bun { width: 144px; height: 144px; animation: drop .6s cubic-bezier(.3, 1.6, .5, 1), wob 1.1s ease-in-out .6s infinite; transform-origin: 50% 90%; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .35)); }
.ov-art .bun.shake { animation: shake .45s linear; }
.ov-art .bun.poof { animation: poof .3s ease-in forwards; }
.ov-art .it { width: 192px; height: 192px; animation: pop .55s cubic-bezier(.2, 1.5, .4, 1); filter: drop-shadow(0 5px 0 rgba(0, 0, 0, .4)); }
.ov-art .it.tk { width: 144px; height: 192px; }
.ov-art .halo { position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 190, .55), rgba(255, 236, 190, 0) 68%); animation: halo 2s ease-in-out infinite; }
.ov.q2 .ov-art .halo { background: radial-gradient(circle, rgba(255, 220, 100, .8), rgba(255, 220, 100, 0) 70%); }
@keyframes halo { 50% { transform: scale(1.08); opacity: .8; } }
@keyframes drop { from { transform: translateY(-260px) scale(.8); } }
@keyframes wob { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-6deg); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px) rotate(-8deg); } 40% { transform: translateX(8px) rotate(8deg); } 60% { transform: translateX(-6px) rotate(-5deg); } 80% { transform: translateX(6px) rotate(5deg); } }
@keyframes poof { to { transform: scale(1.6); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.1) translateY(60px); opacity: 0; } 60% { transform: scale(1.18) translateY(-8px); opacity: 1; } 100% { transform: scale(1); } }
.bits { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.bits i { position: absolute; width: 8px; height: 8px; margin: -4px; background: var(--gold); border: 2px solid #5a3410; animation: burst .8s ease-out forwards; }
.bits i:nth-child(3n) { background: #fff4d8; }
.bits i:nth-child(4n) { background: #ff8a5a; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(180deg); opacity: 0; } }
.ov-name { margin-top: 12px; text-align: center; text-shadow: 2px 2px 0 #1a0c04; animation: rv .4s ease-out .15s both; }
.ov-name.q1 { color: #e6eeff; }
.ov-name.q2 { color: #ffd862; }
.ov-badges { display: flex; gap: 6px; justify-content: center; margin-top: 6px; animation: rv .4s ease-out .2s both; color: var(--ink); }
.ov-line { margin: 8px 8px 0; max-width: 320px; text-align: center; font-size: 16px; color: #f0dcb6; animation: rv .4s ease-out .25s both; }
.ov-hint { margin-top: 18px; color: #d9bd8c; animation: hintb 1.6s ease-in-out infinite; }
@keyframes hintb { 50% { opacity: .5; } }
.ov-acts { position: relative; z-index: 2; width: 100%; max-width: 420px; display: flex; gap: 10px; min-height: 56px; }
.ov-acts .btn { flex: 1; height: 54px; }
.ov-sum { margin-top: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 360px; }
.ov-sum div { width: 80px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; background: rgba(255, 240, 210, .1); border: 2px solid rgba(255, 220, 160, .25); animation: pop .4s ease-out both; }
.ov-sum img { width: 64px; height: 64px; }
.ov-sum span { max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* night / morning transitions */
.fx { position: fixed; inset: 0; z-index: 55; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 24px; pointer-events: none; opacity: 0; transition: opacity 1s; }
.fx.on { opacity: 1; pointer-events: auto; }
.fx.night { background: radial-gradient(circle at 50% 35%, #2c3a6e, #141a36 70%); color: #f4e4bf; }
.fx.dawn { background: linear-gradient(#2a3466 0%, #e88a6a 55%, #ffd690 100%); color: #fff6e0; }
.fx .big { text-shadow: 3px 3px 0 rgba(0, 0, 0, .35); }
.fx p { max-width: 300px; font-size: 16px; opacity: .92; }
.fx .stars i { position: absolute; width: 4px; height: 4px; background: #fff3c8; animation: twk 1.8s ease-in-out infinite; }
@keyframes twk { 50% { opacity: .2; } }

/* toast */
#toasts { position: fixed; left: 0; right: 0; top: calc(var(--top-h) + var(--sat) + 10px); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { max-width: 360px; display: flex; align-items: center; gap: 6px; padding: 8px 14px 8px 8px; background: var(--hi); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 rgba(59, 36, 22, .35); animation: tin .3s cubic-bezier(.2, 1.4, .4, 1); }
.toast img { width: 24px; height: 24px; flex: none; }
.toast.out { animation: fadeout .3s forwards; }
@keyframes tin { from { transform: translateY(-14px) scale(.9); opacity: 0; } }

/* ---------- 旅途 ---------- */
.map { margin: 0; padding: 14px 8px 10px; background: linear-gradient(#e9d3a6, #e2c590); border-bottom: 2px solid var(--ink); position: relative; }
.map::before { content: ""; position: absolute; left: 10%; right: 10%; top: 44px; border-top: 3px dashed rgba(107, 74, 50, .45); }
.map-row { display: flex; gap: 4px; position: relative; }
.rg { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 0 4px; position: relative; }
.rg .em { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--ink); background: var(--c); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .35), inset 0 -4px 0 rgba(0, 0, 0, .18), 0 3px 0 rgba(59, 36, 22, .35); }
.rg .em img { width: 36px; height: 36px; }
.rg .nm { white-space: nowrap; margin-top: 2px; }
.rg .pips { display: flex; gap: 3px; }
.rg .pips i { width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 2px; background: rgba(255, 255, 255, .5); }
.rg .pips i.on { background: var(--gold); }
.rg .fk { color: var(--ink2); }
.rg.here .em { outline: 3px solid #fff4d0; outline-offset: 0; }
.rg .pin { position: absolute; top: -12px; left: 50%; margin-left: 12px; width: 28px; height: 28px; animation: plusbob 1.2s ease-in-out infinite; }
.map-note { text-align: center; margin-top: 8px; color: var(--ink2); }
.seg { display: flex; padding: 3px; gap: 3px; background: var(--parch2); border: 2px solid var(--ink); border-radius: 12px; }
.seg button { flex: 1; min-height: 44px; border-radius: 9px; color: var(--ink2); display: flex; align-items: center; justify-content: center; gap: 4px; }
.seg button.on { background: var(--hi); color: var(--ink); box-shadow: 0 2px 0 rgba(59, 36, 22, .35); }
.segwrap { position: sticky; top: 0; z-index: 5; padding: 10px 12px 8px; background: var(--mid-bg); }
.day-h { display: flex; align-items: center; gap: 8px; margin: 18px 14px 4px; color: var(--ink2); }
.day-h::after { content: ""; flex: 1; border-top: 2px dashed rgba(107, 74, 50, .3); }
#app.ph-night .day-h { color: #c9d0ee; }
#app.ph-night .day-h::after { border-color: rgba(200, 210, 255, .25); }
.log.card { margin-top: 4px; }
.pcs { display: flex; flex-direction: column; gap: 14px; padding: 4px 12px 0; }
.pc { display: flex; gap: 12px; padding: 10px; background: var(--parch); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 rgba(59, 36, 22, .3); align-items: center; }
.pc .im { flex: none; width: 192px; height: 128px; transform: rotate(-1.5deg); filter: drop-shadow(0 2px 0 rgba(59, 36, 22, .3)); }
.pc .cap { flex: 1; min-width: 0; }
.pc .cap p { font-size: 15px; line-height: 1.5; font-style: italic; }
.pc .cap .from { margin-top: 6px; color: var(--ink3); }
@media (max-width: 380px) { .pc { flex-direction: column; align-items: stretch; } .pc .im { align-self: center; } }
.more-btn { display: flex; justify-content: center; margin: 14px 0 0; }

/* ---------- 收藏 ---------- */
.ctabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; padding: 10px 8px 8px; background: var(--mid-bg); }
.ctabs button { flex: 1; min-width: 0; min-height: 48px; border: 2px solid var(--ink); border-radius: 10px; background: var(--parch2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; color: var(--ink2); box-shadow: 0 2px 0 rgba(59, 36, 22, .35); }
.ctabs button b { font-weight: normal; color: var(--ink3); }
.ctabs button.on { background: var(--hi); color: var(--ink); transform: translateY(1px); box-shadow: 0 1px 0 rgba(59, 36, 22, .35); }
.sect-h { display: flex; align-items: center; gap: 6px; margin: 12px 14px 6px; color: var(--ink2); }
.sect-h b { font-weight: normal; margin-left: auto; color: var(--ink3); }
#app.ph-night .sect-h { color: #c9d0ee; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 12px; }
.cell { position: relative; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px 2px 5px; border: 2px solid var(--ink); border-radius: 10px; background: var(--parch); box-shadow: inset 0 0 0 2px var(--hi), 0 2px 0 rgba(59, 36, 22, .3); overflow: hidden; }
.cell:active { transform: translateY(1px); }
.cell img { width: 64px; height: 64px; }
.cell img.tk { width: 48px; height: 64px; }
.cell span { max-width: 100%; padding: 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.cell.q1 { background: linear-gradient(#fbfdff, #e4ebf4); }
.cell.q2 { background: linear-gradient(#fff8d8, #f7e2a0); }
.cell.lock { background: rgba(120, 90, 60, .12); border-style: dashed; border-color: rgba(59, 36, 22, .45); box-shadow: none; color: var(--ink3); }
.cell.lock img { opacity: .55; }
.cback { width: 48px; height: 64px; display: grid; place-items: center; border: 2px solid rgba(59, 36, 22, .55); border-radius: 6px; background: var(--c); opacity: .5;
  box-shadow: inset 0 0 0 3px rgba(255, 248, 230, .55), inset 0 0 0 5px rgba(0, 0, 0, .12); background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .14) 0 4px, transparent 4px 8px); }
.cback b { font-weight: normal; color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .3); }
.cell .n { position: absolute; top: 3px; right: 4px; font: 12px/16px var(--pix); color: var(--ink2); }
.cell .on { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; }
.detail { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 4px 0 6px; }
.detail .big { width: 128px; height: 128px; margin: 4px 0 8px; filter: drop-shadow(0 4px 0 rgba(59, 36, 22, .3)); }
.detail .big.tk { width: 144px; height: 192px; }
.detail .big.pcard { width: 192px; height: 128px; }
.detail .ds { margin-top: 8px; font-size: 16px; color: var(--ink2); max-width: 300px; }
.detail .meta { margin-top: 6px; color: var(--ink3); }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 4px; }
.slot { min-height: 92px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hi); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 2px 0 rgba(59, 36, 22, .3); }
.slot img { width: 64px; height: 64px; }
.slot.empty { border-style: dashed; background: var(--parch2); color: var(--ink3); }
.slot.sel { outline: 3px solid var(--red); outline-offset: 1px; }
.pick-h { margin: 12px 0 6px; color: var(--ink2); }

/* ---------- 更多 ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 8px; background: var(--parch2); }
.week div.early { background: #fff1c4; box-shadow: inset 0 0 0 2px var(--gold); }
.week img { width: 24px; height: 24px; }
.week .t { color: var(--ink2); }
.week .ok { color: var(--jade); }
.week .none { opacity: .45; }
.streak { margin-top: 10px; text-align: center; color: var(--ink2); }
.row { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.row .grow { flex: 1; }
.selpill { height: 44px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hi); box-shadow: 0 2px 0 var(--ink); -webkit-appearance: none; appearance: none; font: 24px/28px var(--pix); color: var(--ink); }
.code { width: 100%; height: 92px; margin-top: 8px; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hi); font: 12px/1.4 ui-monospace, Menlo, monospace; resize: none; word-break: break-all; }
.btns { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.btns .btn { flex: 1; }
.ver { width: 100%; text-align: center; margin: 18px 0 6px; color: var(--ink3); min-height: 44px; display: flex; align-items: center; justify-content: center; }
#app.ph-night .ver { color: #9aa3c8; }
.dev { margin-top: 0; border-style: dashed; }
.note { color: var(--ink3); font-size: 14px; margin-top: 6px; }

/* ---------- create ---------- */
#create { top: 0; bottom: 0; z-index: 30; background: var(--mid-bg); display: flex; flex-direction: column; }
.cr-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 20px; }
.cr-yard { padding-top: var(--sat); background: #9fd4f2; }
.cr-title { position: absolute; left: 0; right: 0; top: calc(var(--sat) + 14px); text-align: center; color: #fff8e6; z-index: 3; pointer-events: none; }
.cr-title h1 { text-shadow: 3px 3px 0 #6b3a1e, -2px 0 0 #6b3a1e, 0 -2px 0 #6b3a1e, 2px 0 0 #6b3a1e; }
.cr-sub { margin-top: 4px; letter-spacing: 2px; text-shadow: 1px 1px 0 #6b3a1e; color: #fff2cc; }
.cr-story p { font-size: 15px; line-height: 1.6; padding: 3px 0; }
.cr-story p + p { border-top: 1px dashed rgba(107, 74, 50, .2); }
.cr-form { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.field .lab { flex: none; width: 64px; color: var(--ink2); }
.field input { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hi); outline: none; box-shadow: inset 0 2px 0 rgba(160, 110, 50, .18); font: 24px/28px var(--pix); }
.field input::placeholder { font: 16px var(--sys); color: var(--ink3); }
.field .seg { flex: 1; }
.field select { flex: 1; height: 48px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hi); -webkit-appearance: none; appearance: none; box-shadow: 0 2px 0 var(--ink); color: var(--ink); font: 24px/28px var(--pix); }
.cr-note { color: var(--ink3); font-size: 14px; }
.cr-go { flex: none; padding: 10px calc(16px + var(--sar)) calc(12px + var(--sab)) calc(16px + var(--sal)); background: var(--mid-bg); border-top: 2px solid rgba(59, 36, 22, .2); }

#app.booting #mid, #app.booting #top, #app.booting #bot { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

</style>
</head>
<body>
<div id="app" class="booting">

  <!-- 新建侠客 -->
  <section id="create" hidden>
    <div class="cr-scroll">
      <div class="scene cr-yard"><div class="cvwrap"><canvas id="cv-create"></canvas></div>
        <div class="cr-title"><h1 class="px36">烟火侠客</h1><div class="px12 cr-sub">挂 机 版</div></div>
      </div>
      <div class="card cr-story" id="cr-story"></div>
      <div class="card cr-form">
        <label class="field"><span class="px12 lab">名字</span><input id="cr-name" maxlength="8" autocomplete="off" placeholder="给他起个名字" enterkeyhint="done"></label>
        <div class="field"><span class="px12 lab">他是</span>
          <div class="seg" id="cr-gender"><button type="button" data-g="m" class="on px24">男侠</button><button type="button" data-g="f" class="px24">女侠</button></div>
        </div>
        <label class="field"><span class="px12 lab">你几点睡</span><select id="cr-bed" class="px24"></select></label>
        <p class="cr-note">到点他就熄灯。比这早睡，夜里会有客人来。</p>
      </div>
    </div>
    <div class="cr-go"><button id="cr-start" class="btn big k-wake px24">开 始</button></div>
  </section>

  <!-- 顶栏 -->
  <header id="top" hidden>
    <button id="tb-me" class="tb-me" aria-label="作息"><canvas id="cv-me" width="64" height="64"></canvas></button>
    <div class="tb-mid">
      <div class="tb-name px12" id="tb-name"></div>
      <div class="spirit" id="tb-spirit" aria-label="精神"><span class="px12">精神</span><span class="bar"><i></i></span></div>
    </div>
    <div class="tb-right">
      <span class="pill" id="tb-time"><img alt=""><b class="px12"></b></span>
      <span class="pill" id="tb-coin"><img alt=""><b class="px12"></b></span>
      <button class="tb-mail" id="tb-mail" aria-label="信箱"><img alt=""><i class="dot" hidden></i></button>
    </div>
  </header>

  <!-- 中间：只有这里滚动 -->
  <main id="mid" hidden>
    <section class="scr" id="scr-home"></section>
    <section class="scr" id="scr-trip" hidden></section>
    <section class="scr" id="scr-coll" hidden></section>
    <section class="scr" id="scr-more" hidden></section>
  </main>

  <!-- 跟着时间走的大按钮 -->
  <div id="act" hidden><button id="act-btn" class="btn big px24"><img alt=""><span></span></button><div id="act-sub" class="act-sub"></div></div>

  <!-- 底栏 -->
  <nav id="bot" hidden>
    <button data-tab="home"><img alt=""><span class="px12">小院</span><i class="dot" hidden></i></button>
    <button data-tab="trip"><img alt=""><span class="px12">旅途</span><i class="dot" hidden></i></button>
    <button data-tab="meal" class="mid"><b><img alt=""></b><span class="px12">记一餐</span></button>
    <button data-tab="coll"><img alt=""><span class="px12">收藏</span><i class="dot" hidden></i></button>
    <button data-tab="more"><img alt=""><span class="px12">更多</span></button>
  </nav>

  <div id="layer"></div>
  <div id="toasts"></div>
</div>
<script>
window.YH_BUILD = "86f082bb5d";
/* ===== px.js ===== */
// px.js: pixel-art raster kit. 1 art pixel = 2 CSS px. Everything is plotted on whole pixels, so sprites stay crisp when scaled.
// Globals: PX (raster kit shared by the art files), pxCanvas, pxSprite.
const PX = (() => {
  const cache = {};

    if (hex == null) return 0;
    if (typeof hex === 'number') return hex;

  const hex = (r, g, b) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); };
  const toHsl = h => { let [r, g, b] = rgb(h).map(v => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let H = 0, S = 0; const L = (mx + mn) / 2; if (mx !== mn) { const d = mx - mn; S = L > .5 ? d / (2 - mx - mn) : d / (mx + mn); H = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; H *= 60; } return [H, S, L]; };
  const fromHsl = (H, S, L) => { H = ((H % 360) + 360) % 360; S = Math.max(0, Math.min(1, S)); L = Math.max(0, Math.min(1, L)); const c = (1 - Math.abs(2 * L - 1)) * S, x = c * (1 - Math.abs((H / 60) % 2 - 1)), m = L - c / 2; const [r, g, b] = H < 60 ? [c, x, 0] : H < 120 ? [x, c, 0] : H < 180 ? [0, c, x] : H < 240 ? [0, x, c] : H < 300 ? [x, 0, c] : [c, 0, x]; return hex((r + m) * 255, (g + m) * 255, (b + m) * 255); };

  const ramp = (base, o = {}) => {
    const [h, s, l] = toHsl(base);
    const k = o.k == null ? 1 : o.k;
    return [
      fromHsl(hueToward(h, 255, 34), Math.min(1, s * .85 + .12), Math.max(.08, l * .32)),
      fromHsl(hueToward(h, 250, 22), Math.min(1, s + .1), l - .25 * k),
      fromHsl(hueToward(h, 245, 10), Math.min(1, s + .06), l - .12 * k),
      base,
      fromHsl(hueToward(h, 55, 12), s * .92, Math.min(.96, l + .15 * k)),

  let seed = 7;

  const reseed = s => { seed = s; };
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  class S {
    constructor(w, h) {
      this.w = w | 0; this.h = h | 0;
      this.a = new Uint32Array(this.w * this.h);
      this.mask = null;  // null: paint anywhere; 'on': only over painted pixels; a colour: only over that colour
      this.ox = 0; this.oy = 0;  // integer translation applied to every plotted pixel
    }
    at(ox, oy) { this.ox = ox | 0; this.oy = oy | 0; return this; }
    p(x, y, c) {
      x = Math.floor(x) + this.ox; y = Math.floor(y) + this.oy;
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      const i = y * this.w + x;
      if (this.mask === 'on') { if (!this.a[i]) return; }
      else if (this.mask === 'off') { if (this.a[i]) return; }
      else if (this.mask != null && this.a[i] !== this.mask) return;
      this.a[i] = C(c);
    }
    g(x, y) { x = Math.floor(x) + this.ox; y = Math.floor(y) + this.oy; return x < 0 || y < 0 || x >= this.w || y >= this.h ? 0 : this.a[y * this.w + x]; }
    rect(x, y, w, h, c) { for (let j = Math.round(y); j < Math.round(y + h); j++) for (let i = Math.round(x); i < Math.round(x + w); i++) this.p(i, j, c); return this; }
    hl(x0, x1, y, c) { for (let i = Math.round(Math.min(x0, x1)); i <= Math.round(Math.max(x0, x1)); i++) this.p(i, y, c); return this; }
    vl(x, y0, y1, c) { for (let j = Math.round(Math.min(y0, y1)); j <= Math.round(Math.max(y0, y1)); j++) this.p(x, j, c); return this; }
    line(x0, y0, x1, y1, c, w = 1) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let e = dx + dy;
      for (;;) {
        if (w === 1) this.p(x0, y0, c); else this.rect(x0 - (w >> 1), y0 - (w >> 1), w, w, c);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
      }
      return this;
    }
    // filled ellipse sampled at pixel centres
    ell(cx, cy, rx, ry, c) {
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const u = (x + .5 - cx) / rx, v = (y + .5 - cy) / ry; if (u * u + v * v <= 1) this.p(x, y, c);
      }
      return this;
    }
    circ(cx, cy, r, c) { return this.ell(cx, cy, r, r, c); }
    // ring (ellipse outline of thickness t)
    ring(cx, cy, rx, ry, t, c) {
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const u = (x + .5 - cx) / rx, v = (y + .5 - cy) / ry, w = (x + .5 - cx) / Math.max(.1, rx - t), q = (y + .5 - cy) / Math.max(.1, ry - t);
        if (u * u + v * v <= 1 && w * w + q * q > 1) this.p(x, y, c);
      }
      return this;
    }
    // polygon, even-odd scanline at pixel centres
    poly(pts, c) {
      let y0 = Infinity, y1 = -Infinity;
      for (const [, y] of pts) { y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
        const yc = y + .5, xs = [];
        for (let i = 0; i < pts.length; i++) {
          const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
          if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax));

      return this;
    }
    // thick quad from a to b, widths at each end (for poles, limbs, blades)
    bar(x0, y0, x1, y1, w0, w1, c) {
      const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      return this.poly([[x0 + nx * w0 / 2, y0 + ny * w0 / 2], [x1 + nx * w1 / 2, y1 + ny * w1 / 2], [x1 - nx * w1 / 2, y1 - ny * w1 / 2], [x0 - nx * w0 / 2, y0 - ny * w0 / 2]], c);

    cap(x0, y0, x1, y1, w0, w1, c) { this.bar(x0, y0, x1, y1, w0, w1, c); this.circ(x0, y0, w0 / 2, c); this.circ(x1, y1, w1 / 2, c); return this; }

        [hx + 11, hy - 6], [hx + 9, hy - 3], [hx + 7, hy - 8], [hx + 2, hy - 4], [hx - 1, hy - 9], [hx - 6, hy - 4], [hx - 9, hy - 8], [hx - 11, hy + 1]], hair);

  // ---------- the body builder ----------
  // pose: {bob, hx, hy (face centre), armN, armF: {s:[x,y], a1, a2} , legs: [[hip,knee,foot]x2], seat, sway, eyes, mouth, hold}
  function build(d, ps) {

    const pr = (r, o) => R.part(r, o);
    const skin = pr(d.skin, { R: 3 }), skinF = pr(d.skin, { R: 6, th: [-.9, -.28, 2], hi: false });

    const hairB = pr(d.hair, { R: 4, grp: 200, th: [-.1, .4, 2] });

    const cuffN = pr(cuffR, { R: 2, th: [-.4, .1, .95] }), cuffF = pr(cuffR, { R: 2, th: [-.4, .2, .95] });
    const armN = pr(d.skin, { R: 2 }), armF = pr(d.skin, { R: 2, th: [-.05, .45, 2] });

    const boot = pr(d.boots, { R: 2 }), boot2 = pr(d.boots, { R: 2, th: [0, .45, 2] });
    const acc = pr(d.accent, { R: 2 }), accB = pr(d.accent, { R: 2, th: [0, .45, 2] });
    const brass = pr(P.brass, { R: 2 }), sheath = pr(P.sheath, { R: 2, th: [0, .5, 2] }), grip = pr(P.wood, { R: 1, flat: 2 });
    const bx = 0, by = ps.bob || 0;

    if (ps.armF && !ps.armF.front) farA = arm(ps.armF, false);
    // legs

      const [hp, kn, ft] = L, part = k === 0 ? pants : pants2, bt = k === 0 ? boot : boot2;
      R.cap(hp[0], hp[1] + by, kn[0], kn[1] + (ps.seat ? by : 0), 6.5, 6, part);
      R.cap(kn[0], kn[1] + (ps.seat ? by : 0), ft[0], ft[1] - 2, 6, 5.4, part);
      const fx = ft[0], fy = ft[1];

      R.poly([[17 + lean, 51 + by], [38 + lean, 51 + by], [41, 58 + by], [47, 62 + by], [48, 67 + by], [44, 69 + by], [16, 69 + by], [14, 64 + by]], skirt);

  // ---------- poses ----------
  const stand = (o = {}) => ({
    legs: [[[24, 61], [23.5, 67], [23.5, 78]], [[32, 61], [32.5, 67], [32.5, 78]]],
    armN: { s: [19, 40], a1: -14, a2: 18 }, armF: { s: [37, 40], a1: 14, a2: -14 }, ...o,
  });
  const ACTS = {
    idle(st) { return stand({ bob: st.breath, sway: st.sway, eyes: st.blink ? 'blink' : 'open' }); },
    wave(st) {
      const f = st.f & 1;
      return stand({ bob: 0, sway: st.sway, eyes: 'happy', mouth: 'grin', armN: { s: [19, 40], a1: -14, a2: 18 }, armF: { s: [37, 40], a1: 150 + f * 14, a2: f ? -30 : 10, front: true } });
    },
    walk(st) {

        [[[24, 61], [21, 68], [20, 77]], [[32, 61], [34, 67], [36, 78]]],

    },
    eat(st) {

        bob: st.breath, sway: st.sway, seat: 'stool', eyes: up ? 'happy' : (st.blink ? 'blink' : 'open'), mouth: up ? 'chew' : 'open',
        legs: [[[30, 63], [44, 64], [44, 78]], [[24, 64], [39, 67], [38, 78]]],
        armF: { s: [37, 40], a1: -40, a2: -70, front: true, l2: 7 },
        armN: { s: [19, 40], a1: 20, a2: up ? 140 : 90, l2: 7 },
        post(R, pr) {
          const bw = pr(P.bowl, { R: 3, th: [-.3, .2, .8], sep: 1 }), bl = pr(['#5a1a1a', '#9a2a2a', '#c8423a', '#e86048', '#ffa080'], { R: 1, flat: 3 });
          R.ell(30, 53, 7.5, 3.4, bw); R.poly([[22.5, 52], [37.5, 52], [35, 58], [25, 58]], bw); R.rect(27, 58, 6, 1.6, bw);
          R.only(bw, r => r.hl(24, 36, 55, bl));
          const soup = pr(['#6a3a10', '#b07020', '#e0a040', '#f4c868', '#fff0b0'], { R: 2, th: [-1, -.5, .7], ol: false });
          R.ell(30, 52, 6, 1.6, soup);
        },
        after(s, by, hx, hy) {
          // chopsticks in the near hand
          const tip = up ? [hx + 1, hy + 7] : [30, 50];
          const hd = up ? [24, 44 + by] : [22, 51 + by];
          s.line(hd[0], hd[1], tip[0], tip[1] + (up ? 0 : by), '#8a5a2a'); s.line(hd[0] + 1, hd[1], tip[0] + 1, tip[1] + (up ? 1 : by), '#c48a4a');
          if (up) { s.p(tip[0] + 1, tip[1] + 1, '#f8e8b0'); s.p(tip[0] + 2, tip[1] + 2, '#f8e8b0'); }
        },
      };
    },
    polish(st) {
      const f = st.f % 4, cx = [22, 26, 30, 26][f];
      return {
        bob: st.breath, sway: st.sway, seat: 'stool', eyes: st.blink ? 'blink' : 'down', mouth: 'smile', hy: 24,

  /* ================= app shell ================= */
  var built = false;
  function showApp(fresh, since) {
    U.creating = false;
    ['#top', '#mid', '#bot'].forEach(function (s) { $(s).hidden = false; });
    $('#create').hidden = true; $('#app').classList.remove('booting');
    if (!built) {
      built = true; buildHome();
      $('#scr-trip').addEventListener('click', onTripClick);
      $('#scr-coll').addEventListener('click', onCollClick);
      $('#scr-more').addEventListener('click', onMoreClick);
      $('#scr-more').addEventListener('change', onMoreChange);
    }
    ensureUI();
    var t = T();
    computeAway(since != null ? since : (S.lastSeen || t - HOUR), fresh);
    S.lastSeen = t; save();
    U.meKey = null; U.tab = 'home';
    go('home'); renderAll();
    U.lastMin = Math.floor(t / MIN);
  }
  function tick() {
    if (!S || U.creating || document.hidden || U.fx) return;
    var t = T(), m = Math.floor(t / MIN);
    if (m === U.lastMin) return;
    U.lastMin = m;
    call(function () { simAdvance(t); });
    S.lastSeen = t; save();
    renderAll(false);
  }
  function onVisible() {
    if (!S || U.creating) return;
    if (document.hidden) { S.lastSeen = T(); save(); return; }
    var t = T(), since = S.lastSeen || t;
    call(function () { simAdvance(t); });
    if (t - since > 20 * MIN) computeAway(since, true);
    S.lastSeen = t; save();
    U.lastMin = Math.floor(t / MIN);
    renderAll();
  }
  function kbFix() {
    var vv = window.visualViewport; if (!vv) return;
    var f = function () { var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb', (kb > 60 ? kb : 0) + 'px'); };
    vv.addEventListener('resize', f); vv.addEventListener('scroll', f);
  }
  function boot() {
    layer = $('#layer');
    $('#act-btn').addEventListener('click', onAct);
    $('#bot').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
    $('#tb-mail').addEventListener('click', function () { U.tripTab = 'post'; go('trip'); });
    $('#tb-me').addEventListener('click', function () { go('more'); });
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('pageshow', function (e) { if (e.persisted) onVisible(); });
    window.addEventListener('resize', fitScenes);
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    kbFix();
    var loaded = typeof simLoad === 'function' ? call(simLoad) : null;
    if (loaded && S) { call(function () { simAdvance(T()); }); showApp(true); }
    else showCreate();
    setInterval(tick, 5000);
    requestAnimationFrame(loop);
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () { });
  }

  return { boot: boot, render: renderAll, go: go, openMeal: openMeal, openBundle: openDoorBundle, sleep: doSleep, wake: doWake, toast: toast, state: U, ctxAction: ctxAction };
})();
UI.boot();

</script>
