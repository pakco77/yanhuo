/* Layout: one phone column. Pixel HUD on top, a small pixel scene strip, then a parchment story panel and big action buttons. */
:root {
  --night: #1b1420;      /* page ground, deep plum-night */
  --wood: #3a2618;       /* frame wood */
  --wood-hi: #6b4528;
  --paper: #f4e7c8;      /* parchment */
  --paper-lo: #e6d3a8;
  --ink: #2b1d12;        /* body text */
  --ink-soft: #6a5038;
  --ember: #d9733a;      /* primary action */
  --gold: #f2b04c;
  --jade: #3f7f6a;
  --px: "Fusion Pixel", "PingFang SC", monospace;
  --body: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--paper); font-family: var(--body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
#app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 10px 12px 18px; gap: 10px; }
.pxf { font-family: var(--px); }
canvas, .ico { image-rendering: pixelated; image-rendering: crisp-edges; }

/* HUD */
.hud { display: flex; align-items: center; gap: 6px; font-family: var(--px); font-size: 24px; line-height: 1; }
.hud .day { color: var(--gold); margin-right: auto; }
.hud .stat { display: flex; align-items: center; gap: 3px; background: #2a1d2c; padding: 4px 7px 4px 4px; box-shadow: 0 0 0 2px #120c14; font-variant-numeric: tabular-nums; }
.hud .stat .ico { width: 24px; height: 24px; }

/* scene strip */
.scene { position: relative; box-shadow: 0 0 0 3px #120c14, 0 0 0 6px var(--wood); margin: 3px; }
.scene canvas { display: block; width: 100%; height: auto; }
.scene .cap { position: absolute; left: 6px; top: 6px; font-family: var(--px); font-size: 24px; color: #fff4dc; text-shadow: 2px 0 #120c14, -2px 0 #120c14, 0 2px #120c14, 0 -2px #120c14; }

/* parchment panel with stepped pixel border */
.panel { background: var(--paper); color: var(--ink); padding: 16px 16px 14px; position: relative;
  box-shadow: 0 -4px 0 -0px var(--paper), 0 4px 0 0 var(--paper), -4px 0 0 0 var(--paper), 4px 0 0 0 var(--paper),
    0 -8px 0 0 #120c14, 0 8px 0 0 #120c14, -8px 0 0 0 #120c14, 8px 0 0 0 #120c14, -4px -4px 0 0 #120c14, 4px -4px 0 0 #120c14, -4px 4px 0 0 #120c14, 4px 4px 0 0 #120c14;
  margin: 8px; }
.panel + .panel { margin-top: 14px; }
.who { display: inline-block; font-family: var(--px); font-size: 24px; line-height: 1; color: var(--paper); background: var(--ember); padding: 3px 8px; margin: -30px 0 8px -4px; box-shadow: 0 0 0 2px #120c14; }
.who.xm { background: var(--jade); }
.who.np { background: #5a4a6a; }
.say { font-size: 17px; line-height: 1.75; margin: 0; }
.say + .say { margin-top: 8px; }
.say b { color: #8a2c1a; font-weight: 700; }
.muted { color: var(--ink-soft); font-size: 15px; line-height: 1.6; }
h2.t { font-family: var(--px); font-size: 24px; line-height: 1.2; margin: 0 0 10px; font-weight: normal; color: var(--ink); text-wrap: balance; }

/* fade-in lines */
.ln { animation: ln .35s both; }
@keyframes ln { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { .ln, .flip { animation: none !important; } }

/* buttons */
.acts { display: grid; gap: 10px; margin: 4px 8px 0; }
.acts.two { grid-template-columns: 1fr 1fr; }
.btn { font-family: var(--px); font-size: 24px; line-height: 1.15; color: #fff4dc; background: var(--ember); border: 0; padding: 12px 10px 11px; cursor: pointer; text-align: center;
  box-shadow: inset 0 -4px 0 #9c4a22, inset 0 3px 0 #f0a070, 0 0 0 3px #120c14; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn small { font-family: var(--body); font-size: 13px; opacity: .85; display: block; }
.btn .col { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
.btn.alt { background: var(--wood-hi); box-shadow: inset 0 -4px 0 #3a2618, inset 0 3px 0 #92633c, 0 0 0 3px #120c14; }
.btn.ghost { background: #2a1d2c; box-shadow: inset 0 -4px 0 #170f18, inset 0 3px 0 #3d2c40, 0 0 0 3px #120c14; }
.btn:disabled { filter: grayscale(.8) brightness(.7); cursor: default; }
.btn:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn .ico { width: 36px; height: 36px; }

/* choice buttons inside panel */
.choice { width: 100%; text-align: left; justify-content: space-between; background: #fff7e2; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.4;
  box-shadow: inset 0 -3px 0 var(--paper-lo), 0 0 0 2px var(--ink); padding: 12px; }
.choice .odds { font-family: var(--px); font-size: 24px; white-space: nowrap; }
.odds.hi { color: var(--jade); } .odds.mid { color: #b07a10; } .odds.lo { color: #a8432f; }
.choices { display: grid; gap: 10px; margin-top: 12px; }

/* route board */
.routes { display: grid; gap: 6px; margin-top: 6px; }
.route { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; font-size: 15px; padding: 4px 6px; }
.route.on { background: #fff7e2; box-shadow: 0 0 0 2px var(--ink); }
.route .zi { font-family: var(--px); font-size: 24px; width: 30px; height: 30px; display: grid; place-items: center; color: #fff; box-shadow: 0 0 0 2px #120c14; }
.route .nm { min-width: 0; }
.route .nm span { color: var(--ink-soft); font-size: 13px; margin-left: 4px; }
.pips { display: flex; gap: 3px; }
.pips i { width: 12px; height: 12px; background: var(--paper-lo); box-shadow: 0 0 0 2px var(--ink-soft); }
.pips i.f { background: var(--ember); box-shadow: 0 0 0 2px #7a3a1a; }
.pips .ico { width: 24px; height: 24px; margin-left: 2px; }

/* eat */
.inrow { display: flex; gap: 8px; }
.inrow input { flex: 1; min-width: 0; font-family: var(--body); font-size: 17px; padding: 10px; border: 0; background: #fff7e2; color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.inrow .btn { font-size: 24px; padding: 8px 14px; }
.chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.chip { display: flex; align-items: center; gap: 8px; background: #fff7e2; border: 0; box-shadow: 0 0 0 2px var(--ink); padding: 6px 8px; font-family: var(--body); font-size: 15px; color: var(--ink); cursor: pointer; text-align: left; }
.chip .ico { width: 36px; height: 36px; flex: none; }

/* card reveal */
.card { margin: 6px auto 12px; width: 220px; padding: 12px; background: #fff7e2; box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px var(--rc), 0 0 0 10px var(--ink); text-align: center; color: var(--ink); }
.flip { animation: flip .6s both; }
@keyframes flip { 0% { transform: perspective(600px) rotateY(90deg) scale(.8); } 60% { transform: perspective(600px) rotateY(-8deg) scale(1.03); } 100% { transform: none; } }
.card .rar { font-family: var(--px); font-size: 24px; color: var(--rc); text-shadow: 2px 2px 0 var(--ink); }
.card .big { width: 120px; height: 120px; margin: 4px auto; display: block; }
.card .nm { font-size: 20px; font-weight: 700; }
.card .fl { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 15px; }
.card .fl .zi { font-family: var(--px); font-size: 24px; color: #fff; padding: 2px 6px; box-shadow: 0 0 0 2px var(--ink); }
.badge { display: inline-block; font-family: var(--px); font-size: 24px; line-height: 1; padding: 3px 6px; background: var(--gold); color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }

/* shop + bag lists */
.goods { display: grid; gap: 10px; margin-top: 8px; }
.good { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 8px; background: #fff7e2; box-shadow: 0 0 0 2px var(--ink); }
.good .ico { width: 48px; height: 48px; }
.good .info { min-width: 0; }
.good .nm { font-size: 17px; font-weight: 700; }
.good .ds { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.tier { font-family: var(--px); font-size: 12px; padding: 1px 4px; color: #fff; margin-left: 4px; vertical-align: 2px; }
.tier.t0 { background: #8a7a62; } .tier.t1 { background: var(--jade); } .tier.t2 { background: #b8321f; }
.tag { font-family: var(--px); font-size: 12px; padding: 1px 4px; background: #a8432f; color: #fff; margin-left: 4px; vertical-align: 2px; }
.buy { font-family: var(--px); font-size: 24px; padding: 6px 8px; min-width: 76px; }
.buy s { font-size: 12px; opacity: .7; margin-right: 2px; }
.sec { font-family: var(--px); font-size: 24px; margin: 14px 0 6px; color: var(--ink); }
.grid15 { display: grid; grid-template-columns: 30px repeat(3, 1fr); gap: 6px; align-items: stretch; }
.grid15 .zi { font-family: var(--px); font-size: 24px; display: grid; place-items: center; color: #fff; box-shadow: 0 0 0 2px #120c14; }
.slot { min-height: 44px; background: var(--paper-lo); box-shadow: 0 0 0 2px var(--ink-soft); display: grid; place-items: center; font-family: var(--px); font-size: 12px; color: var(--ink-soft); text-align: center; padding: 2px; line-height: 1.2; max-width: 100%; }
.slot.got { background: #fff7e2; box-shadow: 0 0 0 2px var(--ink); color: var(--ink); }
.slot.A { box-shadow: 0 0 0 2px #8a6d3b; } .slot.S { box-shadow: 0 0 0 2px #3f68a8; } .slot.SSS { box-shadow: 0 0 0 3px #d4a017; }
.rewards { display: grid; gap: 6px; margin-top: 10px; }
.rw { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.rw .ico { width: 24px; height: 24px; flex: none; }
.foot { margin: 14px 8px 0; font-size: 12px; color: #8d7c90; line-height: 1.6; }
.foot button { background: none; border: 0; color: #c9a9cf; text-decoration: underline; font: inherit; cursor: pointer; padding: 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); font-family: var(--px); font-size: 24px; padding: 8px 14px; box-shadow: 0 0 0 3px var(--gold); z-index: 9; max-width: 90%; }

.who.jg { background: #5a4a8a; } .who.bs { background: #8a2c1a; }
.acts.three { grid-template-columns: repeat(3, 1fr); }

  const t = f < 0 ? 0 : 255, p = Math.abs(f); r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); };

}

const CG_CARDS = {}, CG_OPP = {}, CG_MEAL = {}, CG_KW = {}, CG_SMART = {};

/* 把 cards.json 的内容装进 CG_CARDS 等常量（原地填，常量本身不换）。文件末尾会用内置的 CG_DATA 调一次。 */
function cgLoad(data) {
  const fill = (dst, src) => { for (const k in dst) delete dst[k]; Object.assign(dst, src || {}); };
  const cards = {}, opp = {};
  (data.cards || []).forEach(c => { cards[c.id] = c; });
  (data.opponents || []).forEach(o => { opp[o.id] = o; });
  fill(CG_CARDS, cards); fill(CG_OPP, opp); fill(CG_MEAL, data.meal); fill(CG_KW, data.kw); fill(CG_SMART, data.smart);
}

/* ---------------- 牌和牌匣 ---------------- */

/* 只认对象自己的键（存档被改坏时，'__proto__'、'constructor' 这类名字不会被当成牌） */
function cgHas(o, k) { return o != null && typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k); }
/* 名字截到 4 个字（按字算，不会把 emoji 切成半个） */
function cgShort(n) { return Array.from(String(n)).slice(0, 4).join(''); }

/* 查一张牌的 def：先查 G.x（灵食牌、馋虫），再查 CG_CARDS。G 可以是 null；查不到返回 undefined */
function cgDef(G, id) { return G && cgHas(G.x, id) ? G.x[id] : cgHas(CG_CARDS, id) ? CG_CARDS[id] : undefined; }

/* 一道菜 -> 灵食牌 def。rank 'A'|'S'|'SSS'（界面先按规则封顶），hot 今天吃过为真 */
function cgMealDef(name, t, rank, hot) {
  const M = CG_MEAL;
  if (!cgHas(M.t, t)) t = 'bao';
  if (!cgHas(M.rank, rank)) rank = 'A';
  const T = M.t[t];
  const parts = [[rank + ' 底点', M.rank[rank]]];
  if (T.plus) parts.push([T.ab, T.plus]);
  if (hot) parts.push(['热乎', M.hot]);
  return { id: 'ls:' + name, n: name, tn: T.n, t, row: 'me', pow: parts.reduce((a, p) => a + p[1], 0), ab: T.ab, abv: T.abv,

}

/* 牌匣合不合规。x = {id: 灵食牌def}。返回 {ok, why} */
function cgCheckDeck(ids, x) {

  for (const id of ids) {
    const c = d(id);
    if (!c) return { ok: false, why: '有一张牌找不到了' };
    n[id] = (n[id] || 0) + 1;

  if (rare > CG_RULE.rare) return { ok: false, why: '蓝边最多 3 张' };
  if (meal > CG_RULE.meal) return { ok: false, why: '灵食牌最多 2 张' };
  if (spy > CG_RULE.spy) return { ok: false, why: '探子最多 2 张' };

/* 「炊炊帮我配」：own = {id: 张数}，meals = [灵食牌 def]。返回 {deck, x}，保证合规（牌不够时 deck 会短） */

    const c = cgHas(CG_CARDS, id) ? CG_CARDS[id] : null; if (!c) return;

    if (c.meal && meal >= CG_RULE.meal) continue;
    if (!c.hero && !c.meal && c.q === 2 && rare >= CG_RULE.rare) continue;
    if (c.ab === '探子' && spy >= CG_RULE.spy) continue;

}

/* ---------------- 点数 ---------------- */

/* 这一边那排第 i 张现在的点数：印着的 → 起雾 −2（最低 1，顶饱不吃）→ 同心 ×2 → 每张别的鼓劲 +1。金边永远是印着的 */

/* 渲染一次拿全 */
function cgView(G) {

    score: [cgScore(G, 0), cgScore(G, 1)], row: [cgRow(G, 0), cgRow(G, 1)],
    hand: G.p[0].hand.map((id, i) => {

      return { i, id, n: c.n, sn: cgShort(c.n), pow: c.pow, ab: c.ab || '', q: c.q, hero: !!c.hero, meal: !!c.meal, rank: c.rank || '', parts: c.parts || null };

/* ---------------- 内部：摸牌、落牌、拷贝 ---------------- */

function cgDrawN(G, s, n) { let k = 0; while (n-- > 0 && G.p[s].deck.length) { G.p[s].hand.push(G.p[s].deck.pop()); k++; } return k; }

/* s 把 id 落到桌上（从手里打出，或者被回春叫回来）。fx 收集效果给播报和预告 */

/* ---------------- 开局 ---------------- */

function cgNew(o, rng) {
  rng = rng || Math.random;

  if (!O) throw new Error('cgNew: 没有这位对手 ' + (o && o.opp));
  const f = Object.assign({}, O.passive || {});
  const x = Object.assign({}, o.x || {});
  if (f.token) x.chanchong = { id: 'chanchong', n: '馋虫', row: 'me', pow: f.token, ab: '', abv: null, q: 0, hero: false, tok: 1, flee: 1, ico: 'js_boss', ds: '饿得直哼哼，趴在桌边不肯走。' };
  const known = id => cgHas(x, id) || cgHas(CG_CARDS, id);
  const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const G = {
    v: CG_V, opp: O.id, nm: ['你', O.n], hero: o.name || '侠客', tut: !!o.tut, x, f,
    ai: Object.assign({}, O.ai || {}, o.ai || {}),
    p: [0, 1].map(() => ({ deck: [], hand: [], row: [], dis: [], n: 0 })),
    bowl: 1, wins: [0, 0], turn: 0, passed: [false, false], fp: -1, fog: false, bls: [], cnt: [0, 0], acts: 0,
    h0: [0, 0], seen: [], mu: {}, over: false, res: null, why: '', log: []

  G.p[1].deck = shuf((o.oppDeck || O.deck).filter(known));

    [0, 1].forEach(s => {

  if (f.token) {

    else { G.p[1].row.push({ id: 'chanchong', o: 1, tok: 1 }); G.log.push(`一只馋虫趴到了${O.n}那边（${f.token} 点）。`); }
  }
  const first = o.first === 0 || o.first === 1 ? o.first : f.r1First ? 1 : (rng() < 0.5 ? 0 : 1);
  G.turn = first;
  if (o.first === 0 || o.first === 1) G.log.push(first ? `${O.n}先出。` : '你先出。');
  else if (f.r1First) G.log.push(`${f.r1Name || '热心肠'}：第一碗${O.n}先出。`);
  else G.log.push(`铜钱落地：${first ? O.n + '先出' : '你先出'}。`);
  cgSettle(G, G.log, { bowls: [] });   // 先出的一边手里没牌（坏牌匣）时当场替它收手，保证「轮到的人手里有牌」
  return G;
}

/* ---------------- 合法动作 ---------------- */

function cgMoves(G) {

  out.push({ t: 'pass', s });
  return out;
}
/* 动作合法就返回手牌下标（收手返回 -1），否则 null */

  if (mv.s != null && mv.s !== G.turn) return null;

  if (mv.t !== 'play') return null;

/* ---------------- 预告（不改 G） ---------------- */

    const d = my - ot, res = d > 0 || (d === 0 && tieOk) ? 'win' : d === 0 ? 'tie' : 'short';
    return { bowlRes: res, need: res === 'win' ? 0 : ot - my + (tieOk ? 0 : 1), tieBy: res === 'tie' ? (oppTie ? 'tieWin' : 'firstPass') : '' };

    selfBurn: fx.burn.some(b => b.s === s),

/* ---------------- 走一步 ---------------- */

    if (c.ab === '同心' && G.p[s].row.filter(e => e.id === id).length >= 2) mid = '，和另一张凑成一对';
    if (fx.fog > 0) mid += `，起雾了，每张 −${CG_FOGV}`;
    if (fx.fog < 0) mid += '，雾散了';
    if (fx.revive.length) mid += '，把' + fx.revive.map(r => `【${cgDef(G, r).n}】`).join('') + '又打了出来';
    if (fx.burn.length) {
      // 一下烧好几张时按边数张数，免得一行播报占满屏幕；人和小东西（flee）是「烫跑了」，物件才是「烧掉了」

/* 自动收手、结算这一碗、定下一碗谁先出，直到轮到某人做决定或整局结束 */

    const t = G.turn;

  if (G.f.keepBest && !over) {
    let bi = -1, bv = -1;
    G.p[1].row.forEach((e, i) => { if (e.o !== 1 || e.tok) return; const v = cgVal(G, 1, i); if (v > bv) { bv = v; bi = i; } });
    if (bi >= 0) keep = G.p[1].row.splice(bi, 1)[0];
  }
  for (let sd = 0; sd < 2; sd++) { G.p[sd].row.forEach(e => { if (!e.tok) G.p[e.o].dis.push(e.id); }); G.p[sd].row = []; G.p[sd].n = 0; }
  G.fog = false; G.passed = [false, false]; G.fp = -1;
  if (over) {
    G.over = true; G.res = w === 0 ? 'win' : 'loss';
    L.push(w === 0 ? `你赢了 ${G.wins[0]} : ${G.wins[1]}。` : `你输了 ${G.wins[0]} : ${G.wins[1]}。`);
    return rec;
  }
  if (keep) { G.p[1].row.push({ id: keep.id, o: 1, k: 1 }); L.push(`${G.f.keepName || '守夜'}：${G.nm[1]}留下【${cgDef(G, keep.id).n}】守着下一碗。`); }
  G.bowl++;
  if (G.bowl === 3 && CG_RULE.r3draw) {
    const k0 = cgDrawN(G, 0, CG_RULE.r3draw), k1 = cgDrawN(G, 1, CG_RULE.r3draw);
    if (k0 === CG_RULE.r3draw && k1 === CG_RULE.r3draw) L.push(`最后一碗，两边各摸 ${CG_RULE.r3draw} 张。`);
    else if (!k0 && !k1) L.push('最后一碗，两边牌堆都空了，不摸牌。');
    else L.push(`最后一碗，你摸 ${k0} 张，${G.nm[1]}摸 ${k1} 张。`);
  }
  if (G.f.drawOnLoss && w === 0) { const k = cgDrawN(G, 1, G.f.drawOnLoss); if (k) L.push(`${G.f.drawName || '落叶归根'}：${G.nm[1]}摸了 ${k} 张牌。`); }
  if (G.f.token && !(G.f.full && G.f.fullNoToken)) { G.p[1].row.push({ id: 'chanchong', o: 1, tok: 1 }); L.push(`又一只馋虫趴到了${G.nm[1]}那边。`); }
  G.turn = w;
  L.push(`${CG_BN[G.bowl]}，${nm(G.turn)}先出。`);
  return rec;
}

/* 这一局输了，算不算「连输」（让一手的计数）：只认打完了的好彩头局。认输、切磋（paid 为假）、教学局都不算；
   你还得至少两碗各从手里出过一张牌，一路直接收手送掉的局也不算。赢了由调用方把连输清零。 */
function cgLossCounts(G, paid) {
  if (!G || !G.over || G.res !== 'loss' || G.why === 'resign' || G.tut || !paid) return false;
  return (G.bls || []).filter(b => b.pn && b.pn[0] > 0).length >= 2;
}

function cgResign(G) {
  if (!G || G.over) return { lines: [], bowl: null, bowls: [], over: !!(G && G.over) };
  G.over = true; G.res = 'loss'; G.why = 'resign';
  const L = ['你认输了。']; G.log.push(L[0]);
  return { lines: L, bowl: null, bowls: [], over: true };
}

/* ---------------- AI（对手和「问小满」共用） ---------------- */

/* 每张手牌在局面拷贝上试打一遍 */
function cgOpts(G, me) {
  const my = cgScore(G, me), ot = cgScore(G, 1 - me);
  return G.p[me].hand.map((id, hi) => {
    const T = cgLite(G), fx = cgFx(), c = cgDef(G, id);
    T.p[me].hand.splice(hi, 1); cgPut(T, me, id, fx);
    const m2 = cgScore(T, me), o2 = cgScore(T, 1 - me);
    return { hi, id, ab: c.ab || '', swing: (m2 - my) - (o2 - ot) + 3.5 * fx.drawn, after: m2 - o2,
      cost: c.ab === '探子' ? -2 : c.pow + (c.hero ? 4 : 0), selfBurn: fx.burn.some(b => b.s === me), drawn: fx.drawn };
  });
}

/* 返回 [动作, 理由代码]。P = AI 参数（cards.json opponents[].ai 或 smart）。rng 只用来「走眼」，可以是 null */
function cgDecide(G, me, P, rng) {
  P = P || {};
  if (!G || !G.p) return [{ t: 'pass', s: me }, 'empty'];
  const op = 1 - me, hand = G.p[me].hand;
  const R = (x, why) => [x < 0 ? { t: 'pass', s: me } : { t: 'play', i: x, id: hand[x], s: me }, why];
  if (G.over || !hand.length) return R(-1, 'empty');
  const my = cgScore(G, me), ot = cgScore(G, op), lead = my - ot, tieMine = me === 1 && !!G.f.tieWin;
  const ahead = l => l > 0 || (l === 0 && (tieMine || (!G.f.tieWin)));   // 我现在收手、打平时算不算我的
  const mustWin = G.wins[op] === 1, iLead = G.wins[me] === 1 && G.wins[op] === 0;
  const myH = hand.length, opH = G.p[op].hand.length, played = G.p[me].n;
  // 对面这一碗已经不会再加分了：收了手，或者手里没牌（轮到它时会被自动收手）
  const opDone = G.passed[op] || !opH;
  // 我现在收手，这一碗就稳稳是我的
  const safeNow = G.passed[op] ? (lead > 0 || (lead === 0 && tieMine)) : (opDone && ahead(lead));
  if (P.maxPerRound && played >= P.maxPerRound) return R(-1, 'quota');
  const all = cgOpts(G, me);
  const legal = all.filter(o => {
    if (o.selfBurn && o.swing < 0) return false;
    if (o.ab === '烈火' && o.swing < (P.scorchMin || 1)) return false;
    if (o.ab === '起雾' && o.swing < (P.fogMin || 1)) return false;
    if (o.ab === '探子' && (G.passed[op] || (mustWin && G.bowl === 3))) return false;
    return true;
  });
  const winsAfter = o => o.after > 0 || (o.after === 0 && tieMine);   // 对面已收手（或手里没牌、会先被自动收手）：打平归对面（除非我有黏糊）
  if (!legal.length) {
    // 手里每张都在排除之列（净亏的烈火、不划算的起雾、不该出的探子）：收手。
    // 只有「这碗输了就全输了，而且现在收手必输」时才硬出：能反超就出最省的那张，不然出涨分最多的碰碰运气（探子还能摸牌）。
    if (safeNow) return R(-1, 'won');
    const doomed = (mustWin || G.bowl === 3) && (opDone || !ahead(lead));
    if (!doomed) return R(-1, 'bad');
    const w = all.filter(winsAfter).sort((a, b) => a.cost - b.cost || b.swing - a.swing)[0];
    if (w) return R(w.hi, 'take');
    return R(all.slice().sort((a, b) => b.swing - a.swing || a.cost - b.cost)[0].hi, 'all');
  }
  const pool = legal;
  const bySwing = pool.slice().sort((a, b) => b.swing - a.swing || a.cost - b.cost);
  const byCost = pool.slice().sort((a, b) => a.cost - b.cost || b.swing - a.swing);
  const pickBest = list => (list.length > 1 && rng && P.rand && rng() < P.rand ? list[1].hi : list[0].hi);
  const cheapestWin = byCost.filter(winsAfter)[0];

  if (opDone) {
    if (P.hothead && G.bowl === 1 && lead < P.hothead) return R(pickBest(bySwing), 'push');
    if (safeNow) return R(-1, 'won');
    if (cheapestWin) {
      if (mustWin || G.bowl === 3) return R(cheapestWin.hi, 'take');
      if (P.style === 'low') { if (-lead <= P.chase) return R(cheapestWin.hi, 'take'); return R(-1, 'save'); }
      if (!P.thrifty || myH - 1 >= opH || cheapestWin.cost <= (P.takeCost || 5)) return R(cheapestWin.hi, 'take');
    }
    if (mustWin || G.bowl === 3) return R(pickBest(bySwing), 'all');
    if (-lead <= (P.chase || 0) && myH - 1 >= opH) return R(P.style === 'low' ? byCost[0].hi : bySwing[0].hi, 'chase');
    return R(-1, 'save');
  }
  if (P.hothead && G.bowl === 1) return lead >= P.hothead ? R(-1, 'lead') : R(pickBest(bySwing), 'push');
  if (!mustWin) {
    // 已赢一碗、这碗还没出牌：马上收手逼对面花牌。前提是对面不出牌就拿不下这碗（馋虫、守夜的牌让它领先时不能这么做）
    if (P.r2pass && iLead && played === 0 && ahead(lead) && myH >= opH - 1 + (P.r2adv || 0)) return R(-1, 'r2pass');
    if (ahead(lead) && lead >= (P.leadPass != null ? P.leadPass : 99) && myH >= opH) return R(-1, 'lead');
    if (played >= 1 && lead <= -(P.concede != null ? P.concede : 99) && myH >= opH - (iLead ? 1 : 0)) return R(-1, 'concede');
    if (iLead && played >= 1 && lead <= -(P.concede2 != null ? P.concede2 : 99)) return R(-1, 'concede');
    const bn = P.budget ? Math.ceil(G.h0[me] * P.budget) : 99;
    if (G.bowl === 1 && played >= bn && myH - opH <= 1) {
      if (ahead(lead)) return R(-1, 'budget');
      const cw1 = byCost.filter(o => o.after > 0)[0];
      if (played === bn && cw1 && -lead <= 8) return R(cw1.hi, 'take');
      return R(-1, 'budget');
    }
  }
  if (P.spyFirst && G.bowl < 3) { const sp = pool.find(o => o.ab === '探子'); if (sp) return R(sp.hi, 'spy'); }
  if (P.style === 'low') return R(byCost[0].hi, 'low');
  // mwCheap：输不起的这碗不急着亮大牌：领先就垫最小的，落后就出刚好反超里最省的，大牌留到最后（也躲开对面的烈火）
  if (P.mwCheap && (mustWin || G.bowl === 3)) {
    if (lead > 0) return R(byCost[0].hi, 'mwlow');
    const cwm = byCost.filter(o => o.after > 0)[0];
    if (cwm) return R(cwm.hi, 'take');
  }
  if (mustWin || G.bowl === 3 || P.style === 'high') return R(pickBest(bySwing), 'push');
  const spy = pool.find(o => o.ab === '探子'); if (spy && G.bowl === 1) return R(spy.hi, 'spy');
  const cw = byCost.filter(o => o.after > 0)[0];
  if (cw && lead <= 0) return R(cw.hi, 'take');
  const cw2 = P.costW != null ? P.costW : 0.35;
  return R(pickBest(pool.slice().sort((a, b) => (b.swing - cw2 * b.cost) - (a.swing - cw2 * a.cost) || a.cost - b.cost)), 'play');
}

/* ---------- 点击 ---------- */
function paiClick(a, d, el) {
  if (!/^(pai|pack)/.test(a)) return false;
  const P = paiInit(), L = P.live, G = L && L.G;
  const my = () => PM && L && !G.over && G.turn === 0 && !PM.ov && !(PM.kw && PM.kw.length) && !PM.coin;
  switch (a) {
    case 'paiopp': S.paiSel = d.o; S.screen = 'paigo'; break;
    case 'paistart': paiStart(S.paiSel); return true;
    case 'paitut': PAI_CONF = 0; paiTutStart(); return true;
    case 'paiskip': if (L && L.tut) { paiClear(); P.live = null; } paiTutEnd(1); return true;
    case 'paicont': PAI_CONF = 0; if (!L || mgLock('card') || paiSoon()) break; paiClear(); S.screen = 'paiplay'; break;
    case 'paiquit': PAI_CONF = 1; break;
    case 'paiquit0': PAI_CONF = 0; break;
    case 'paiquit2': PAI_CONF = 0; paiResign(); return true;
    case 'paiagain': if (mgLock('card') || paiSoon()) { S.screen = 'day'; break; } S.paiSel = (P.last && P.last.oid) || S.paiSel; S.screen = 'paigo'; break;
    case 'paideck': PAI_BACK = d.from || 'pai'; S.screen = 'paideck'; break;
    case 'paibook': S.screen = 'paibook'; break;
    case 'paitab': PAI_TAB = d.t; break;
    case 'paibtab': PAI_BOOK = d.t; break;
    case 'paimore': PAI_MORE = !PAI_MORE; break;
    case 'paiin': { const x = paiX([...P.deck, d.id]), own = d.id.startsWith('ls:') ? (S.album[d.id.slice(3)] ? 1 : 0) : P.own[d.id] || 0;
      if (P.deck.filter(z => z === d.id).length >= own) break;
      if (P.deck.length >= CG_RULE.deck) { toast('牌匣满了，先拿出一张'); break; }
      const c = cgCheckDeck([...P.deck, d.id], x); if (!c.ok && !/还差/.test(c.why)) { toast(paiWhy(c.why)); break; }
      P.deck.push(d.id); break; }
    case 'paiout': { const i = P.deck.lastIndexOf(d.id); if (i >= 0) P.deck.splice(i, 1); break; }
    case 'paiauto': { const r = cgAutoDeck(P.own, paiMeals()); P.deck = r.deck.slice(); toast('炊炊帮你配好了'); break; }
    case 'paihintt': { const on = S.screen === 'paiplay' && L ? !!L.hint : paiHintOn(); P.hintSet = 1; P.hint = on ? 0 : 1; if (L) L.hint = P.hint; if (PM) { PM.menu = 0; render(); paiKick(); return true; } break; }
    case 'paiflip': if (P.last && P.last.op) { P.last.op[+d.i] = 1; if (P.last.cards.every((c, i) => P.last.op[i])) break; el.classList.add('open'); save(); } return true;
    case 'packflip': if (S.paiPack) { S.paiPack.op[+d.i] = 1; if (S.paiPack.c.every((c, i) => !c.id || S.paiPack.op[i])) break; el.classList.add('open'); save(); } return true;
    case 'packdone': S.paiPack = null; S.screen = 'shop'; break;
    // 对局页

  paiMorning().forEach(r => rows.push(r));
  rows.unshift(['coin', `金币 +${coins}（${parts.join(' + ')}）`]);
  S.coins += coins;
  newDay();
  const pl = placed();
  S.morning = { hello, rows, tease, decor: pl.length ? DEC[pick(pl)].morning : '', ms };
  S.screen = 'morning'; render();
}
function logNight(bedTs, wakeTs, manual) {
  const h = roundH(Math.min(14, (wakeTs - bedTs) / 3600000));
  const late = noonMin(bedTs) - tgtMin();
  S.early = !manual && late <= 0 && noonMin(bedTs) >= 360;
  S.nights.push({ d: S.day, bed: hm(bedTs), wake: hm(wakeTs), bm: noonMin(bedTs), h, early: S.early, late: Math.max(0, late), manual: !!manual, target: S.target, bedTs, wakeTs });
  if (S.nights.length > 120) S.nights.shift();
  S.bedTs = null;
  goSleep(h);
}
function newDay() { S.day++; S.meals = []; S.xmLine = ''; S.carry = (S.bonus.fx || []).filter(f => f.k === 'visitor_rate' || f.k === 'fortune_up'); S.bonus = { e: 0, p: 0, pb: 0, fx: [], chestUp: 0, used: [] }; }
function fight() {
  const N = S.night, cards = S.hist.slice();
  const VERB = { lie:'化作一道火光，烧得饥太岁直缩舌头', xian:'化作一阵清风，吹散了它吐出的黑雾', gan:'化作一层甜甜的金光，护住了侠客', chun:'化作一声清醒的钟响，震得它晃了三晃', bao:'化作一碗热饭的力气，侠客的刀更稳了' };
  const uniq = [...new Map(cards.map(c => [c.n, c])).values()];
  const best = uniq.slice().sort((a, b) => ['A', 'S', 'SSS'].indexOf(b.r) - ['A', 'S', 'SSS'].indexOf(a.r) || a.d - b.d).slice(0, 5).sort((a, b) => a.d - b.d);
  const supply = cards.reduce((s, c) => s + RAR[c.r].e, 0);
  const total = supply + N.energy + bladeObj().feng * 20;
  const grade = cards.length >= 30 ? '完胜' : cards.length >= 15 ? '大胜' : '险胜';
  const lines = ['饥太岁一口咬下来。侠客身后，你这些天吃过的饭一顿顿亮了起来：',
    ...best.map(c => `第 ${c.d} 天的<b>${c.n}</b>（${c.r}）${VERB[c.t]}。`),
    cards.length > best.length ? `还有另外 ${cards.length - best.length} 顿饭，一起涌了上来。` : '',
    `<span class="roll">补给 ${supply}（${cards.length} 张灵食卡）+ 精力 ${N.energy} + 刀 ${bladeObj().feng * 20} = ${total}</span>`,
    `侠客一刀斩下。<b>${grade}。</b>`];
  const rescue = '老巢深处走出一个瘦老头，手里还握着一把锅铲。炊炊扔下勺子跑了过去：「师父！」';
  S.final = { lines, rescue };
  S.won = true;
  if (!S.inv.some(g => g.b === 'fenghuo')) { const g = makeGear('fenghuo', 3); S.inv.push(g); seeGear(g); }
  S.gear.w = S.inv.find(g => g.b === 'fenghuo').u;
  const b = fragCount('boss'); S.lore = 5; if (fragCount('boss') > b) S.newFrag.push('boss');
  gain('chui', 3);
  S.coins += 200;
  S.screen = 'final'; render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (v5click(a, b)) return;
  if (a === 'start' || a === 'day') { S.screen = 'day'; render(); }
  else if (a === 'eat') { RECOG = null; S.screen = 'eat'; render(); setTimeout(() => { const d = document.getElementById('dish'); if (d && matchMedia('(pointer:fine)').matches) d.focus(); }, 50); }
  else if (a === 'dish') { const d = DISHES[+b.dataset.i]; eatDish(d.n, d.t); }
  else if (a === 'shop') { if (S.xmDay !== S.day) { S.xmDay = S.day; gain('xm', 1); } S.screen = 'shop'; render(); }
  else if (a === 'bag' || a === 'people' || a === 'sleep' || a === 'records' || a === 'hero') { S.screen = a; render(); }
  else if (a === 'bed') { if (napNow()) { toast('白天的觉不用记，晚上再来点「我去睡了」'); render(); return; } S.bedTs = Date.now(); S.early = noonMin(S.bedTs) <= tgtMin() && noonMin(S.bedTs) >= 360; S.screen = 'sleeping'; render(); }
  else if (a === 'unbed') { if (!unbedSure(b)) return; S.bedTs = null; S.early = !!(S.nights.length && S.nights[S.nights.length - 1].early); S.screen = 'day'; toast('好，这次不算。睡前再点「我去睡了」'); render(); }
  else if (a === 'wake') { if (Date.now() - S.bedTs < 3 * 3600000) { S.screen = 'shortwake'; render(); } else logNight(S.bedTs, Date.now(), false); }
  else if (a === 'wakeok') logNight(S.bedTs, Date.now(), false);
  else if (a === 'day-sleeping') { S.screen = 'sleeping'; render(); }
  else if (a === 'manual') { S.screen = 'manual'; render(); }
  else if (a === 'manualok') {
    const tb = document.getElementById('mbed').value, tw = document.getElementById('mwake').value; if (!tb || !tw) return;
    const now = new Date(), w = new Date(now); w.setHours(+tw.slice(0, 2), +tw.slice(3), 0, 0); if (w > now) w.setDate(w.getDate() - 1);
    const bd = new Date(w); bd.setHours(+tb.slice(0, 2), +tb.slice(3), 0, 0); if (bd >= w) bd.setDate(bd.getDate() - 1);
    if (bd.getTime() < lastWakeTs()) { toast('这段时间已经记过了，去「作息」看看'); return; }
    logNight(bd.getTime(), w.getTime(), true);
  }
  else if (a === 'rtag') { RECOG.tag = b.dataset.t; RECOG.tagSet = 1; RECOG.dish = document.getElementById('rname').value.trim() || RECOG.dish; render(); }
  else if (a === 'rok') { const n = (document.getElementById('rname').value.trim() || RECOG.dish).slice(0, 14); if (!n) { toast('先写下菜名'); return; } eatDish(n, RECOG.manual && !RECOG.tagSet ? classify(n) : RECOG.tag, RECOG.thumb, 'photo'); }
  else if (a === 'evpick') {
    const D = EV.find(x => x.id === S.ev.id), c = D.ch[+b.dataset.i];
    applyEff(c[2]); S.ev.res = c[1]; S.ev.effs = effText(c[2]); S.ev.done = true;
    if (S.ev.w === 'n') prepNight();
    render();
  }
  else if (a === 'evnext') { S.screen = S.ev.next; S.ev = null; render(); }
  else if (a === 'talkpick') { const c = TALK[S.talk.i]().ch[+b.dataset.i]; applyEff(c[2]); S.talk.res = c[1]; S.talk.effs = effText(c[2]); S.talk.done = true; render(); }
  else if (a === 'talkdone') { S.screen = 'day'; render(); }
  else if (a === 'cpick') { syncDraft(); S.draft[b.dataset.k] = b.dataset.v; render(); }
  else if (a === 'cdone') {
    syncDraft(); const D = S.draft;
    if (!D.name.trim()) { toast('先起个名字'); document.getElementById('cname').focus(); return; }
    S.hero = { name: D.name.trim().slice(0, 6), sex: D.sex, origin: D.origin, keep: D.keep, motive: D.motive, fav: D.fav.trim().slice(0, 10) };
    S.target = document.getElementById('ctarget').value || S.target;
    if (D.origin === 'book') { S.lore += 1; S.yuan.xm += 2; }
    if (D.origin === 'cook') S.yuan.chui += 3;
    if (D.origin === 'biao') { /* 镖局出身的加成在算把握时给 */ }
    delete S.draft; S.screen = S.day === 1 && !S.hist.length ? 'intro' : 'day'; render();
  }
  else if (a === 'choose') choose(+b.dataset.i);
  else if (a === 'dawn') dawn();
  else if (a === 'fight') fight();
  else if (a === 'dawnfinal') { S.streak = S.early ? S.streak + 1 : 0; S.chest = rollChest('boss'); newDay(); S.morning = null; openChest(S.chest); S.screen = 'chest'; render(); }
  else if (a === 'reset') {
    if (b.dataset.sure) { if (Date.now() - +b.dataset.sure < 800) return; S = fresh(); migrate(); FG = null; clearDuel(); DG = null; paiClear(); xiaoClear(); render(); }
    else { const t0 = b.textContent; b.dataset.sure = Date.now(); b.textContent = '再点一次确认清空'; setTimeout(() => { if (b.isConnected && b.dataset.sure) { delete b.dataset.sure; b.textContent = t0; } }, 3000); }
  }
});
function syncDraft() { const n = document.getElementById('cname'), f = document.getElementById('cfav'), t = document.getElementById('ctarget'); if (n) S.draft.name = n.value; if (f) S.draft.fav = f.value; if (t && t.value) S.target = t.value; }
document.addEventListener('keydown', e => { if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229 || !e.target || e.target.id !== 'rname') return; e.preventDefault(); const b = document.querySelector('[data-a=rok]'); if (b) b.click(); });
document.addEventListener('submit', e => {
  if (e.target.id !== 'eatf') return; e.preventDefault();
  const v = document.getElementById('dish').value.trim(); if (!v) return;
  eatDish(v, classify(v), RECOG && RECOG.thumb, RECOG && RECOG.thumb ? 'photo' : 'text');
});
document.addEventListener('change', e => {
  if (e.target.id === 'photo' && e.target.files[0]) recognize(e.target.files[0]);
  if (e.target.id === 'target') { S.target = e.target.value; render(); }
});
render();
</script>
